# 天听 H5 的安全响应头（PRD-ui NF-UI-14，PRD-chat 第 13.2 节），由 deploy/nginx.conf 在每个带 add_header 的地方 include。
# files.example.com 换成对象存储的实际域名，和构建变量 VITE_STORAGE_ORIGINS 一致（只写具体的源，不能写 https: 或 *）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://files.example.com; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
