# 天听 H5 的部署示例（同源：静态文件、/ws、/v1/、/demo/login 在同一个域名下，PRD-ui F-UI-03 规则 7）。
server {
  listen 443 ssl http2;
  server_name im.example.com;

  root /srv/tianting-web/dist;
  index index.html;

  # 安全响应头（PRD-ui NF-UI-14）：CSP 与 index.html 里的 meta 一致，另外加上只能用响应头设置的 frame-ancestors。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # 前端路由：未知路径都回到 index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
  location /ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  # 账号接口（PRD-chat 第 4.2 节规则 6）。不能给这里加 WWW-Authenticate（部署手册第 1 节，SDK 设计说明 S2）；
  # POST 不能重发：不要配 proxy_next_upstream 到非幂等请求（默认就不重发）。
  location /v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Forwarded-For $remote_addr;
    # 查询串和 Authorization 不进 access log；这里不打印请求体。
  }
  # 演示环境才有；生产构建（VITE_DEMO_LOGIN=false）不显示演示表单，不会调用
  location = /demo/login {
    proxy_pass http://127.0.0.1:8080;
  }
}
