# /etc/nginx/snippets/tianting-headers.conf 的内容见 deploy/tianting-headers.conf。
# 天听 H5 的部署示例（同源：静态文件、/ws、/v1/、/demo/login 在同一个域名下，PRD-ui F-UI-03 规则 7）。
server {
  listen 443 ssl http2;
  server_name im.example.com;

  root /srv/tianting-web/dist;
  index index.html;

  # 安全响应头（PRD-ui NF-UI-14）：CSP 与 index.html 里的 meta 一致，另外加上只能用响应头设置的 frame-ancestors。
  # 图片和文件（PRD-chat 第 13.2 节，AC-FILE-03-10）：connect-src 只加对象存储的具体域名（和构建变量
  # VITE_STORAGE_ORIGINS 相同，这里的 files.example.com 换成实际域名），不能放宽成 https:；img-src 加 blob:。
  # 存储那边的 CORS 要允许本站的源 PUT（带预签名里的 Content-Type）和 GET。
  # 注意：nginx 的 add_header 只在当前层没有 add_header 时才继承上一层，所以每个带 add_header 的 location 都 include 一次。
  include /etc/nginx/snippets/tianting-headers.conf;

  location /assets/ {
    include /etc/nginx/snippets/tianting-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # 前端路由：未知路径都回到 index.html
  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/tianting-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location /ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  # 账号接口（PRD-chat 第 4.2 节规则 6）。不能给这里加 WWW-Authenticate（部署手册第 1 节，SDK 设计说明 S2）；
  # POST 不能重发：不要配 proxy_next_upstream 到非幂等请求（默认就不重发）。
  location /v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Forwarded-For $remote_addr;
    # 查询串和 Authorization 不进 access log；这里不打印请求体。
  }
  # 演示环境才有；生产构建（VITE_DEMO_LOGIN=false）不显示演示表单，不会调用
  location = /demo/login {
    proxy_pass http://127.0.0.1:8080;
  }
}
